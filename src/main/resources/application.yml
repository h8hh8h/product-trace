server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  application:
    name: product-trace
  servlet:
    multipart:
      # 后端接口层 MediaController 已按规格校验，这里是 Tomcat 容器上限（500MB 足够覆盖视频上传）
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.trace.product.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============ 业务配置 ============
trace:
  # 防伪配置
  anti-fake:
    # 一物一码默认扫码次数上限：前端未传 scanLimit 时用这个值；0 表示不限
    default-scan-limit: 3
    # 码信息（ProductCode + Product 基础信息）Redis 缓存时间（秒）
    meta-ttl: 600
    # 扫码计数 key（trace:code:scan:{code}）过期时间（秒），7 天足够覆盖防伪场景
    count-ttl: 604800
  # 防伪验证接口 IP 限流（VerifyRateLimitInterceptor）
  rate-limit:
    verify:
      # 同一 IP 每 window 秒最多 limit 次；生产建议 10 次/分钟
      limit: 10
      window: 60

  # ============ 扫码地理位置（v4 新增，IpRegionService）============
  geo:
    # 关闭后扫码不再解析 IP 归属地，scan_province/city 留空
    enabled: true
    # 离线 IP 库路径；留空则使用 classpath:ip2region_v4.xdb（约 11MB，随 jar 打包）
    # 生产可指向外部文件，换库时无需重新打包，例如 /www/wwwroot/product-trace/api/ip2region_v4.xdb
    xdb-path: ""

  # ============ 安全策略（v3 新增）============
  security:
    login:
      # 同一用户名连续登录失败多少次后锁定（用用户名而非 IP，防代理绕过）
      max-fail: 5
      # 锁定时长（分钟）
      lock-minutes: 30
    password:
      # 密码最小长度；同时要求必须包含字母 + 数字
      min-length: 8
    cors:
      # 允许的跨域来源，逗号分隔；留空表示同域反代部署，不注册 CORS
      # 生产示例：https://admin.example.com,https://h5.example.com
      allowed-origins: ""

  # ============ 定时清理任务（v3 新增，ScheduledCleanupTask）============
  cleanup:
    # 总开关，false 时三组清理任务全部跳过
    enabled: true
    csv:
      # 一物一码导出 CSV 保留天数，过期后删除文件并清空下载链接
      retain-days: 30
      cron: "0 10 3 * * ?"
    orphan:
      # 未被数据库引用的媒体文件保留天数（防止误删正在编辑的新文件）
      retain-days: 7
      cron: "0 20 3 ? * SUN"
    scan-record:
      # 扫码明细保留天数；<=0 表示永久保留（默认不删，数据量大后再开启）
      retain-days: 0
      cron: "0 30 3 1 * ?"

  # 一物一码异步批量生成（BatchCodeService）
  batch:
    # 批量入库 chunk 大小
    chunk-size: 500
    # 进度写 Redis 间隔（每 N 条更一次）
    progress-interval: 100
    # Redis 进度 TTL（秒）；v2 起同时持久化到 batch_code_task 表，Redis 过期不影响历史查询
    progress-ttl: 86400
  # H5 扫码落地页前缀
  #   普通码二维码内容 = 这个值 + "/" + code
  #   一物一码二维码内容 = 这个值 + "/" + code
  #   生产必须改成 https://h5.example.com/scan（Nginx 302 到前端 history 路由）
  h5:
    scan-base-url: https://h5.your-domain.com/scan

# ============ 微信公众号（H5 微信内自定义分享 JSSDK，可选）============
wx:
  mp:
    app-id: ""
    app-secret: ""

# ============ 媒体存储（策略模式，一键切换 local → oss/vod 业务代码零改动）============
media:
  storage:
    # 这里的值仅作为「数据库 sys_storage_config 表为空时的兜底默认值」，
    # 实际生效配置请在后台「系统管理 → 存储配置」页面维护（保存后即时生效，无需重启）
    type: local
    local:
      # 本地存储根目录（绝对路径，必须与 Nginx location /upload/ 的 alias 一致）
      root-path: /www/wwwroot/product-trace/upload
      # 对外 URL 前缀；/upload 表示相对路径，由前端按同域解析
      url-prefix: /upload
    oss:
      endpoint: ""
      access-key-id: ""
      access-key-secret: ""
      bucket-name: ""
      url-prefix: ""
    vod:
      access-key-id: ""
      access-key-secret: ""
      region: ""
      url-prefix: ""

# ============ 运维监控（v3 新增）============
# 本机校验：curl http://127.0.0.1:8080/api/actuator/health
# 生产环境请通过 Nginx 只允许内网 / 监控服务器访问 /actuator，切勿对外暴露
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ============ 日志（具体滚动策略见 logback-spring.xml）============
logging:
  level:
    root: info
