# ============================================================
# 产品溯源系统 - 宝塔 Nginx API 站点配置
# 文件位置：/www/server/panel/vhost/nginx/bt_nginx_api.conf
# 说明：该文件被 nginx.conf 的 http 块 include，所以 map 必须写在 server 外。
# 需要替换：api.yourdomain.com / h5.yourdomain.com / SSL 证书路径
# ============================================================

# ---------------- CORS 允许来源（按实际域名增删） ----------------
map $http_origin $trace_cors_origin {
    default                              "";
    "~^https://h5\.yourdomain\.com$"     $http_origin;
    "~^https://admin\.yourdomain\.com$"  $http_origin;
    "~^http://localhost:5173$"           $http_origin;
    "~^http://127\.0\.0\.1:5173$"        $http_origin;
}

# ---------------- WebP 协商：客户端支持时优先返回同名 .webp ----------------
map $http_accept $trace_webp_suffix {
    default          "";
    "~*image/webp"   ".webp";
}

# ---------------- HTTP 强制跳转 HTTPS ----------------
server {
    listen      80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    server_name api.yourdomain.com;

    # 宝塔申请证书后，替换为实际路径
    ssl_certificate     /www/server/panel/vhost/cert/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/api.yourdomain.com.log;
    error_log  /www/wwwlogs/api.yourdomain.com.error.log;

    # 后台上传图片/视频最大 500MB，与 application.yml 保持一致
    client_max_body_size 500m;
    client_body_timeout  300s;

    # 媒体根目录：文件实际位于 /www/wwwroot/media/uploads/images|videos
    # 对应 application-prod.yml: media.storage.local.root-path
    root /www/wwwroot/media;

    gzip on;
    gzip_min_length  1k;
    gzip_comp_level  5;
    gzip_types       application/json application/javascript text/css text/plain image/svg+xml;

    # ============================================================
    # 1. API 反向代理 + 完整 CORS
    # ============================================================
    location /api/ {
        # 预检请求由 Nginx 直接返回，不进入 Java 应用
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $trace_cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With, Accept" always;
            add_header Access-Control-Max-Age           3600 always;
            add_header Content-Length 0;
            add_header Content-Type   text/plain;
            return 204;
        }

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # 覆盖而不是追加，防止客户端伪造 X-Forwarded-For 绕过后端 IP 限流
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 后端 Spring 已配置 CORS，隐藏后再由 Nginx 统一输出，避免重复响应头
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        add_header Access-Control-Allow-Origin      $trace_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With, Accept" always;
        # 暴露后端限流头，方便前端读取 429 重试时间
        add_header Access-Control-Expose-Headers    "X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Window, Retry-After" always;
        add_header Access-Control-Max-Age           3600 always;
        add_header Vary Origin always;
    }

    # ============================================================
    # 2. 本地图片：WebP 优先 + 压缩缓存
    # ============================================================
    location /uploads/images/ {
        # WebP 由后端上传时调用本地 cwebp 实时生成（原文件名 + .webp，见 LocalStorageStrategy）
        # 历史图片可用 deploy/nginx/convert-webp.sh 批量补齐
        # 客户端 Accept: image/webp 时命中 .webp；未生成则自动回退原图
        try_files $uri$trace_webp_suffix $uri =404;

        add_header Vary Accept always;
        add_header Access-Control-Allow-Origin * always;
        expires 30d;
        access_log off;

        # 说明：Nginx 原生 image_filter 只能缩放/压缩，不能把 JPG/PNG 编码为 WebP。
        # 需要缩略图时，可另建 /uploads/thumbs/ 目录并启用：
        # image_filter_buffer 20M;
        # image_filter resize 800 -;
        # image_filter_jpeg_quality 82;
        # image_filter_webp_quality 80;
    }

    # ============================================================
    # 3. 本地视频：Referer 防盗链 + Range + mp4 拖动
    # ============================================================
    location /uploads/videos/ {
        # 允许：无 Referer（小程序 video 组件/播放器）、本站、H5 域名、微信来源
        # 其他来源（盗链站点）返回 403
        valid_referers none server_names ~servicewechat\.com h5.yourdomain.com yourdomain.com *.yourdomain.com;
        if ($invalid_referer) {
            return 403;
        }

        try_files $uri =404;

        # 启用 mp4 伪流式，允许拖动进度条
        # 需 Nginx 编译了 --with-http_mp4_module（宝塔默认包含，可用 nginx -V 校验）
        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 10m;

        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin * always;
        expires 7d;
        access_log off;
    }

    # ============================================================
    # 4. 其他上传资源（二维码图片等）
    # ============================================================
    location /uploads/ {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin * always;
        expires 7d;
        access_log off;
    }

    # 异步批量生成的 CSV 仅允许通过后端下载接口获取，禁止公网直链
    location ^~ /uploads/csv/ {
        deny all;
    }

    # 禁止访问隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}
