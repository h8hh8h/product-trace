# ============================================================
# 媒体服务 Nginx 配置（宝塔环境）
# 功能：静态文件服务 + WebP 自适应 + Referer 防盗链 + 缓存
# 放置路径：/www/server/panel/vhost/nginx/media.conf
# 或在站点配置中 include
# ============================================================

# map 只能位于 http 上下文，必须写在 server 外
map $http_accept $webp_suffix {
    default   "";
    "~*webp"  ".webp";
}

server {
    listen       80;
    listen       443 ssl http2;
    server_name  media.your-domain.com;

    # SSL 证书（宝塔申请后替换路径）
    ssl_certificate     /www/server/panel/vhost/cert/media.your-domain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/media.your-domain.com/privkey.pem;

    # 媒体根目录（与 application.yml media.storage.local.root-path 一致）
    root  /www/wwwroot/media;

    # ----- Referer 防盗链 -----
    valid_referers none blocked server_names
        *.your-domain.com
        your-domain.com;

    if ($invalid_referer) {
        return 403;
    }

    # 图片：优先尝试 WebP 版本，不存在则返回原图
    location ~* \.(jpg|jpeg|png|gif|bmp)$ {
        # 尝试同名 .webp 文件
        try_files $uri$webp_suffix $uri =404;

        expires      30d;
        access_log   off;
        add_header   Cache-Control "public, immutable";
        add_header   Vary Accept;

        # 如需动态缩放，启用 image_filter 模块（需编译进 Nginx）
        # image_filter resize 1920 -;
        # image_filter_jpeg_quality 85;
        # image_filter_buffer 20M;
    }

    # 视频：允许 Range 请求，支持拖动播放
    location ~* \.(mp4|webm|ogg)$ {
        expires      7d;
        access_log   off;
        add_header   Cache-Control "public";
        add_header   Accept-Ranges bytes;
        # 视频不防盗链（小程序/ H5 播放器可能不带 Referer），如需限制请用签名 URL
    }

    # 其他静态资源
    location / {
        expires      7d;
        add_header   Cache-Control "public";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
