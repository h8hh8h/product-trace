# ============================================================
# 用户端 H5 站点（Uni-app 编译产物：frontend-uniapp/dist/build/h5）
# 部署路径：/www/wwwroot/product-trace/h5/dist
# 关键点：history 路由 + SPA 回退，使 /p/123 这类扫码短链可直接访问
# ============================================================

server {
    listen       80;
    listen       443 ssl http2;
    server_name  h5.your-domain.com;

    ssl_certificate     /www/server/panel/vhost/cert/h5.your-domain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/h5.your-domain.com/privkey.pem;

    root  /www/wwwroot/product-trace/h5/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 接口反向代理（H5 与 API 同域时，前端 BASE_URL 可配置为 https://h5.your-domain.com/api）
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 媒体文件（若与 H5 同域）
    location /media/ {
        alias /www/wwwroot/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 静态资源长缓存（文件名带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 扫码短链 /p/123、/scan/123 及 history 路由统一回退到 index.html
    # 前端 App.vue 会解析 location.pathname 并跳转到产品详情页
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
