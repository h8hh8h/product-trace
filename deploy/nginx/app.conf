# ============================================================
# 应用反向代理 Nginx 配置（宝塔环境）
# 将域名请求转发到 Spring Boot jar（127.0.0.1:8080）
# ============================================================

server {
    listen       80;
    listen       443 ssl http2;
    server_name  api.your-domain.com;

    ssl_certificate     /www/server/panel/vhost/cert/api.your-domain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.your-domain.com/privkey.pem;

    # 上传大文件支持
    client_max_body_size 500m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # 管理后台静态资源（Vue3 打包后放此目录）
    location /admin/ {
        alias  /www/wwwroot/product-trace/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # H5 静态资源（Uni-app H5 打包后放此目录）
    location /h5/ {
        alias  /www/wwwroot/product-trace/h5/dist/;
        try_files $uri $uri/ /h5/index.html;
    }
}
