# ============================================================
# 部署目录结构（宝塔 Linux 服务器）
# ------------------------------------------------------------
# /www/wwwroot/product-trace/        # 项目根
# ├── api/product-trace.jar           # 后端可执行 jar
# ├── admin/dist/                     # 管理后台静态（admin-web/dist 内容）
# ├── h5/dist/                        # 用户端 H5 静态（frontend-uniapp/dist/build/h5 内容）
# └── upload/                         # 媒体文件（后端 StorageConfig 动态配置存储路径，
#                                       Nginx 反代到后端处理，不再硬编码 alias）
#     ├── images/
#     ├── videos/
#     ├── qrcode/
#     └── csv/   （禁止公网直链，只允许后台接口下载）
# ============================================================

# -------------------- API 域名 --------------------
server {
    listen      80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /www/server/panel/vhost/cert/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 500m;
    client_body_timeout  300s;

    access_log /www/wwwlogs/api.yourdomain.com.log;
    error_log  /www/wwwlogs/api.yourdomain.com.error.log;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # 管理后台 / H5 都走同域 /api 反代，浏览器不产生跨域，无需在此配置 CORS
    # 小程序请求不校验 CORS；如确有跨域需求，请在宝塔主配置的 http{} 块里加 map，不能写在 server 内
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;   # 覆盖而非追加，防止伪造绕过后端 IP 限流
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 媒体文件：反代到后端 /upload/** 控制器，从 DB 配置的 local_root_path 读取。
    # 后端存储路径可在「后台 → 系统管理 → 存储配置」中修改，此处无需同步改动。
    # CSV 目录禁止公网直链访问（后端控制器已做二次校验，Nginx deny 为双重保险）。
    location ^~ /upload/csv/ {
        deny all;
    }
    location /upload/ {
        proxy_pass         http://127.0.0.1:8080/api/upload/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Range             $http_range;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;

        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin * always;
    }

    # 健康检查（方便宝塔监控）
    location = /health {
        proxy_pass http://127.0.0.1:8080/api/health;
    }
}


# -------------------- 管理后台域名 --------------------
server {
    listen      80;
    server_name admin.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    server_name admin.yourdomain.com;

    ssl_certificate     /www/server/panel/vhost/cert/admin.yourdomain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/admin.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /www/wwwroot/product-trace/admin/dist;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 生产环境：admin-web 的 vite.config.js 中 proxy 只在 dev 生效
    # 生产需要直接访问 api.yourdomain.com，前端 request.js baseURL 改为 https://api.yourdomain.com/api
    # 这里留个同域反代的 fallback（如果想 admin 域名下直接反代 /api）
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              api.yourdomain.com;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 媒体文件：反代到后端，存储路径改动无需同步修改 Nginx
    location ^~ /upload/csv/ {
        deny all;
    }
    location /upload/ {
        proxy_pass         http://127.0.0.1:8080/api/upload/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Range             $http_range;

        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin * always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. { deny all; }
}


# -------------------- 用户端 H5 域名 --------------------
server {
    listen      80;
    server_name h5.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    server_name h5.yourdomain.com;

    ssl_certificate     /www/server/panel/vhost/cert/h5.yourdomain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/h5.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /www/wwwroot/product-trace/h5/dist;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 媒体文件：反代到后端，存储路径改动无需同步修改 Nginx
    location ^~ /upload/csv/ {
        deny all;
    }
    location /upload/ {
        proxy_pass         http://127.0.0.1:8080/api/upload/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Range             $http_range;

        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin * always;
    }

    # 生产环境 H5 通过同域反代 /api 访问后端（前端 config.js 设 VITE_API_BASE_URL=/api 即可）
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              api.yourdomain.com;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 扫码短链：/scan/CODE、/p/CODE 直接 302 到详情页
    # uni-app H5 对未知路径可能先白屏再跳，这里由服务器直接跳转，最稳
    location ~ ^/(scan|p)/([A-Za-z0-9_-]+)$ {
        return 302 /pages/product/detail?code=$2;
    }

    # history 路由回退（/p/123、/scan/CAAF86FAD092 扫码短链都能打开）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. { deny all; }
}
